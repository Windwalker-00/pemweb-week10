<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir Data Diri</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f0f0; margin: 0; padding: 40px 20px; }
    .card { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.15); box-sizing: border-box; }
    h1 { margin-top: 0; }
    label.judul { display: block; font-weight: bold; font-size: 18px; margin: 18px 0 8px; }
    input[type="text"], input[type="date"] { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc;
            border-radius: 6px; box-sizing: border-box; }
    .hobi label { display: block; font-size: 18px; margin: 6px 0; }
    button { margin-top: 16px; padding: 10px 16px; font-size: 18px; color: #fff; background: #007bff;
             border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Formulir Data Diri</h1>

    <!-- method POST: data dikirim ke proses_data_diri.php -->
    <form action="proses_data_diri.php" method="POST">

      <label class="judul" for="nama">Nama Lengkap:</label>
      <input type="text" id="nama" name="nama" required>   

      <label class="judul" for="tgl">Tanggal Lahir:</label>
      <input type="date" id="tgl" name="tanggal_lahir" required>

      <label class="judul">Hobi:</label>
      <div class="hobi">
        <label><input type="checkbox" name="hobi[]" value="Membaca"> Membaca</label>
        <label><input type="checkbox" name="hobi[]" value="Olahraga"> Olahraga</label>
        <label><input type="checkbox" name="hobi[]" value="Musik"> Musik</label>
        <label><input type="checkbox" name="hobi[]" value="Lainnya"> Lainnya</label>
      </div>

      <button type="submit">Kirim</button>
    </form>
  </div>
</body>
</html>
